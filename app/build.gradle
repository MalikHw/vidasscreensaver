plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.malikhw.vidasscrsvr'
    compileSdk 34

    defaultConfig {
        applicationId "com.malikhw.vidasscrsvr"
        minSdk 21
        targetSdk 36
        versionCode 7
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def ksFile       = System.getenv("KEYSTORE_FILE")
            def requireSign  = System.getenv("REQUIRE_RELEASE_SIGNING") == "true"
            def ksExists     = ksFile != null && file(ksFile).exists()

            if (ksExists) {
                storeFile     file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            } else if (requireSign) {
                throw new GradleException(
                    "Release signing required but KEYSTORE_FILE is unset or missing " +
                    "(KEYSTORE_FILE=${ksFile}). Refusing to silently fall back to debug signing.")
            } else {
                initWith debug
            }
        }
    }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Google Play Billing (Donate dialog - copied from orbit-screensaver-android)
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}